#
# Build and check the CUDA backend plugin (plugins/cuda).
#
# The plugin needs no GPU to BUILD, and everything that does not need one is tested here: the artifact's ABI
# symbol and DT_NEEDED (it names the RENAMED ORT core and never upstream's SONAME, and links no CUDA library),
# a real dlopen with the loader's flags (an artifact that does not resolve passes nm and fails here), create()
# refusing cleanly with no CUDA provider, the weight-feeding code (safetensors + tensor map, F16 upcast, in
# place / copied / transposed, AddExternalInitializers) run on ORT's CPU provider against reference scores
# computed by Python onnxruntime, and survival of a host that already loaded an upstream-SONAME core. A GPU is
# needed to RUN the plugin for real: that is plugins/cuda/gpu_test (a RunPod harness, by hand).
#
# Deliberately separate from MainDistributionPipeline.yml (scaffold-owned): the plugin versions independently
# of the extension binary and needs none of the DuckDB platform matrix. A version tag attaches the plugin and
# its sha256 sidecar to the GitHub release (through _gpu_release_assets.yml, which also gates on the
# DECIDE_PLUGIN_RELEASE_TAG self-pin), which is what decide_download_runtime('cuda') fetches. (The ORT
# core and providers are NOT release assets: the extension pulls them from Microsoft's feed, size- and
# sha256-pinned.)
#
name: CUDA plugin

# `main` and release tags on push; every branch through pull_request. Without the branch filter a same-repo PR
# matches both events and the whole workflow runs twice for identical trees.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ORT_VERSION: "1.29.0"

jobs:
  cuda-plugin:
    name: CUDA plugin (links its own renamed ONNX Runtime core)
    timeout-minutes: 20
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The CPU release archive carries the same public headers and the same exported C API as the GPU
      # distribution, which is all the plugin is linked against. CMake downloads it, renames its core with the
      # extension's own SONAME routine (src/include/decide_soname_patch.hpp) and builds against that.
      - name: Configure
        run: cmake -S plugins/cuda -B build-cuda-plugin -DCMAKE_BUILD_TYPE=Release -DDECIDE_CUDA_ORT_VERSION="${ORT_VERSION}"

      - name: Build
        run: cmake --build build-cuda-plugin -j"$(nproc)"

      - name: Test (no GPU needed)
        run: ctest --test-dir build-cuda-plugin --output-on-failure

      - name: Checksum sidecar
        run: |
          cd build-cuda-plugin
          # Named by the file, because decide_download_runtime matches the sidecar line by filename.
          sha256sum libanofox_decide_cuda_plugin.so | tee cuda_plugin.sha256

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: anofox-decide-cuda-plugin
          path: |
            build-cuda-plugin/libanofox_decide_cuda_plugin.so
            build-cuda-plugin/cuda_plugin.sha256
          if-no-files-found: error

  publish:
    name: Attach the plugin to the release (tags only)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [cuda-plugin]
    permissions:
      contents: write
    uses: ./.github/workflows/_gpu_release_assets.yml
    with:
      artifact: anofox-decide-cuda-plugin
      plugin: libanofox_decide_cuda_plugin.so
      sidecar: cuda_plugin.sha256
      dry_run: ${{ github.event_name == 'workflow_dispatch' }} # a manual run verifies only; a tag publishes
