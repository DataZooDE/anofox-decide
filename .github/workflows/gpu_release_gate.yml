#
# Release gate for the GPU plugins: a `v*` tag build fails at once when DECIDE_PLUGIN_RELEASE_TAG does not name the
# tag. The three plugin workflows (CUDA, MIGraphX, MLX) attach their assets to the release of this tag, and
# decide_download_runtime fetches from the release the constant names, so a mismatch would ship code that downloads
# the previous release's plugins. Each publish job repeats the check; this one makes the failure visible first and
# once, on the tag's own run list, without waiting for three builds.
#
# Pull requests run the script against the pin itself, so a malformed constant is caught before a tag exists.
#
name: GPU release gate

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'tools/ci/check_plugin_pin.sh'
      - 'tools/ci/release_assets_complete.sh'
      - 'src/include/decide_plugin_artifacts.hpp'
      - '.github/workflows/gpu_release_gate.yml'
      - '.github/workflows/_gpu_release_assets.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: DECIDE_PLUGIN_RELEASE_TAG matches the tag
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag build - the pin must equal the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: tools/ci/check_plugin_pin.sh "${GITHUB_REF_NAME}"
      - name: Other builds - the pin must be a well-formed release tag, and the gate must reject a wrong tag
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          pinned="$(sed -n 's/.*DECIDE_PLUGIN_RELEASE_TAG = "\(.*\)".*/\1/p' src/include/decide_plugin_artifacts.hpp)"
          echo "pinned: ${pinned}"
          echo "${pinned}" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' || { echo "::error::malformed pin '${pinned}'"; exit 1; }
          tools/ci/check_plugin_pin.sh "${pinned}"
          if tools/ci/check_plugin_pin.sh v1999.01.01; then echo "::error::the gate accepted a wrong tag"; exit 1; fi
      - name: The completeness check names what is missing, and passes only with all six assets
        run: |
          all='libanofox_decide_cuda_plugin.so cuda_plugin.sha256 libanofox_decide_migraphx_plugin.so migraphx_plugin.sha256 libanofox_decide_mlx_plugin.dylib mlx_plugin.sha256'
          printf '%s\n' ${all} | tools/ci/release_assets_complete.sh v2026.10.14 -
          if out="$(printf '%s\n' ${all} | grep -v '^mlx_plugin.sha256$' | tools/ci/release_assets_complete.sh v2026.10.14 -)"; then
            echo "::error::five assets were accepted as complete"; exit 1
          fi
          test "${out}" = "mlx_plugin.sha256" || { echo "::error::wrong missing list: ${out}"; exit 1; }
