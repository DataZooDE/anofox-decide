#
# Builds, tests and (on version tags) releases the extension via DuckDB's
# reusable distribution pipeline.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  # The job names below deliberately carry NO DuckDB version. main's branch protection requires
  # these checks by their exact reported name, so a name like "Build extension binaries (v1.5.6)"
  # had to be edited in the repository settings on every DuckDB bump (and enforce_admins is on, so
  # a stale name cannot be bypassed). The version is still visible in `duckdb_version` below and
  # in the run's logs. Job IDs keep their historical "v1_5_5" spelling on purpose: they never
  # appear in a check name, and renaming them would only churn `needs:`.
  duckdb-v1_5_5-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: anofox_decide
      # ONNX Runtime is linked statically from the vcpkg overlay port (the
      # "ort-vcpkg" manifest feature, on by default in the Makefile), so the
      # loadable extension is one self-contained file.
      # Excluded: WASM/musl (ORT), MinGW (vcpkg OpenSSL, house pattern), and
      # osx_amd64 (ONNX Runtime ships no macOS x86_64 archive after v1.23.2).
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64

  duckdb-v1_5_5-smoke-test:
    name: Smoke test
    needs: duckdb-v1_5_5-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_decide
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64'

  # anofox-visualization picks up the contract producers (#34): the DoD for them, so deploy waits for it.
  duckdb-v1_5_5-visualization-pickup:
    name: Visualization pickup
    needs: duckdb-v1_5_5-build
    uses: ./.github/workflows/_visualization_pickup.yml
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_decide

  duckdb-v1_5_5-deploy:
    name: Deploy extension binaries
    needs: [duckdb-v1_5_5-build, duckdb-v1_5_5-smoke-test, duckdb-v1_5_5-visualization-pickup]
    # Deploy only ever uploads on main or a v* tag (deploy_latest/deploy_versioned
    # below) -- everything else, including every PR, is a dry run that still pays
    # for "Configure AWS Credentials" and fails there for a fork PR (no repo
    # secrets/OIDC for fork-triggered pull_request runs -- a GitHub Actions
    # security boundary, not something fixable from workflow config). Skipping
    # the whole job outside that condition turns that into a grey "skipped"
    # instead of a red, permanently-failing, ignorable check on every PR.
    #
    # success() is explicit: a job-level `if:` replaces the implicit success()
    # check GitHub applies to `needs` by default, so without it deploy could run
    # on main/a tag even if build or smoke-test failed.
    #
    # Uploads to the S3 bucket in the DEPLOY_S3_BUCKET repository variable (the
    # anofox extension repository), exactly as anofox-tabfm does.
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: anofox_decide
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  # DuckDB 2.0, the line community-extensions builds `repo.ref` against (v2.0.1 =
  # commit 8d78114e90). Keep the version in step with community-extensions'
  # DUCKDB_LATEST_STABLE. reduced_ci_mode is disabled so PR runs build macOS too
  # and the smoke test finds every artifact. Smoke test and deploy mirror the
  # v1.5.6 line now that a released v2.0.1 CLI exists. The job names carry no
  # patch version, so a DuckDB 2.0.x bump does not rename any check.
  duckdb-next-build:
    name: Build extension binaries (DuckDB 2.0)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.1
      ci_tools_version: v2.0-cyanoptera
      extension_name: anofox_decide
      reduced_ci_mode: disabled
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64

  duckdb-next-smoke-test:
    name: Smoke test (DuckDB 2.0)
    needs: duckdb-next-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v2.0.1
      extension_name: anofox_decide
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64'

  duckdb-next-deploy:
    name: Deploy extension binaries (DuckDB 2.0)
    needs: [duckdb-next-build, duckdb-next-smoke-test]
    # Same gating as the v1.5.6 deploy above; versioned paths only from tag runs.
    if: success() && (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v2.0.1
      extension_name: anofox_decide
      exclude_archs: wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw;linux_amd64_musl;osx_amd64
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
